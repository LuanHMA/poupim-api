services:
  db:
    image: postgres:18
    container_name: expense-system-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: expense_system
    ports:
      - "5432:5432"
    volumes:
      - expense_system_pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d expense_system"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  expense_system_pg:
